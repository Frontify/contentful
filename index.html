<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body {
            padding: 0;
            margin: 0;
        }

        #root {
            width: 100%;
        }

        /* Dialog only: fill the modal. Other locations (e.g. the entry field)
           must keep auto height so Contentful's auto-resizer can measure content. */
        html.dialog, html.dialog body {
            height: 100%;
        }

        html.dialog #root {
            height: 100%;
            overflow: hidden;
        }

        .frontify-finder-iframe {
            border: 0;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/index.js"></script>
</body>
</html>
